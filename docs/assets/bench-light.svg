<svg xmlns="http://www.w3.org/2000/svg" width="860" height="494" viewBox="0 0 860 494" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">lucene-rs vs Apache Lucene 10.5.2</title>
<desc id="desc">single term (300): lucene-rs 27.7 µs, Lucene 54.9 µs, 1.98x faster ; AND of 2–4 terms (300): lucene-rs 109.8 µs, Lucene 165.0 µs, 1.50x faster ; OR of 2–4 terms (301): lucene-rs 122.7 µs, Lucene 203.5 µs, 1.66x faster ; exact phrase (300): lucene-rs 369.9 µs, Lucene 728.3 µs, 1.97x faster ; open index: lucene-rs 2.2 ms, Lucene 378 ms, 169x faster ; first pass over 901 queries (cold): lucene-rs 106 ms, Lucene 672 ms, 6.4x faster</desc>
