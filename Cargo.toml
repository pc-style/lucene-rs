[package]
name = "lucene-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
crc32fast = "1.5.2"
memmap2 = "0.9.11"
rustc-hash = "2.1.3"
unicode-segmentation = "1.13.3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1

[features]
profile = []

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
# deny, not forbid: exactly two audited sites opt out (mmap in index/segment.rs and the AVX2
# prefix sum in codec/postings_reader.rs). See docs/lints.md.
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
